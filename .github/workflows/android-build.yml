name: Android Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" "platforms;android-37" "build-tools;36.0.0"

      - name: Extract project
        run: |
          rm -rf extracted
          mkdir extracted
          unzip -q MahmoodAI_Android_v1.2_BUILDABLE.zip -d extracted

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        working-directory: extracted/src
        run: |
          gradle testDebugUnitTest assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MahmoodAI-debug-apk
          path: extracted/src/app/build/outputs/apk/debug/app-debug.apk
